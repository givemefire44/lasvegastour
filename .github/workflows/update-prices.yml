name: Update Tour Prices & Ratings

on:
  schedule:
    # Cada 72 horas (lunes, jueves a las 6 AM UTC)
    - cron: '0 6 * * 1,4'
  workflow_dispatch: # Permite ejecutar manualmente desde GitHub

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: tour-importer
        run: npm ci

      - name: Install Chromium for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Run price & rating update
        working-directory: tour-importer
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node cron-prices.mjs --execute

      - name: Rebuild corpus (with fresh prices)
        working-directory: tour-importer
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: node build-corpus.mjs

      - name: Analyze corpus
        working-directory: tour-importer
        run: node analyze-corpus.mjs

      - name: Regenerate AI citable phrases
        working-directory: tour-importer
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: node apply-citables.mjs --all --yes

      - name: Notify IndexNow (Bing)
        env:
          INDEXNOW_HOST: colosseumroman.com
          INDEXNOW_KEY: fd3b235575b044c1b491dda0d4057aaa
        run: |
          set -e
           curl -fsSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" --retry 3 --retry-delay 5 "https://${INDEXNOW_HOST}/sitemap.xml" -o sitemap.xml || { echo "Sitemap no disponible, salteo IndexNow"; exit 0; }
          grep -oP '(?<=<loc>)[^<]+' sitemap.xml | head -n 10000 > urls.txt
          COUNT=$(wc -l < urls.txt)
          echo "Encontradas ${COUNT} URLs en el sitemap"
          if [ "$COUNT" -eq 0 ]; then
            echo "No se encontraron URLs, abortando notificacion"
            exit 0
          fi
          URL_LIST=$(jq -R . urls.txt | jq -s .)
          PAYLOAD=$(jq -n \
            --arg host "$INDEXNOW_HOST" \
            --arg key "$INDEXNOW_KEY" \
            --arg keyLoc "https://${INDEXNOW_HOST}/${INDEXNOW_KEY}.txt" \
            --argjson urls "$URL_LIST" \
            '{host: $host, key: $key, keyLocation: $keyLoc, urlList: $urls}')
          HTTP_CODE=$(curl -s -o response.txt -w "%{http_code}" \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$PAYLOAD")
          echo "IndexNow respondio HTTP ${HTTP_CODE}"
          cat response.txt || true
          echo ""
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ]; then
            echo "IndexNow notifico ${COUNT} URLs a Bing"
          else
            echo "IndexNow respondio HTTP ${HTTP_CODE} (no aborta el workflow)"
          fi