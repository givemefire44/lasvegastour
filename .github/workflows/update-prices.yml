name: Update Tour Prices & Ratings (lasvegastour)

on:
  schedule:
    - cron: '0 6 * * 1,4'
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
      SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
      SANITY_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      VIATOR_API_KEY: ${{ secrets.VIATOR_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: tour-importer
        run: npm ci

      - name: Refrescar corpus desde Viator
        working-directory: tour-importer
        run: node ingest-corpus.mjs

      - name: Correr cron de precios y ratings
        working-directory: tour-importer
        run: node cron-prices.mjs --execute

      - name: Notify IndexNow (Bing)
        # Nada de "|| exit 0" aca. Un fallo que sale en verde no se entera nadie:
        # colosseumroman y scooterstour estuvieron meses sin notificarle nada a Bing
        # porque Cloudflare le devolvia 403 al runner y el step lo tapaba. Si algo
        # falla, este step tiene que romper.
        env:
          INDEXNOW_HOST: lasvegastour.com
          INDEXNOW_KEY: b62806b355294ae38198b7a021a1492a
        run: |
          set -euo pipefail
          echo "Bajando https://${INDEXNOW_HOST}/sitemap.xml"
          curl -fsSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" --retry 3 --retry-delay 5 "https://${INDEXNOW_HOST}/sitemap.xml" -o sitemap.xml
          # El || true es para que un grep sin resultados no mate el script antes
          # de llegar al chequeo de abajo, que es el que explica que paso.
          grep -oP '(?<=<loc>)[^<]+' sitemap.xml | head -n 10000 > urls.txt || true
          COUNT=$(wc -l < urls.txt)
          echo "Son ${COUNT} URLs"
          if [ "$COUNT" -lt 20 ]; then
            echo "Solo ${COUNT} URLs: eso no es el sitio entero, aborto sin notificar"
            exit 1
          fi
          URL_LIST=$(jq -R . urls.txt | jq -s .)
          PAYLOAD=$(jq -n \
            --arg host "$INDEXNOW_HOST" \
            --arg key "$INDEXNOW_KEY" \
            --arg keyLoc "https://${INDEXNOW_HOST}/${INDEXNOW_KEY}.txt" \
            --argjson urls "$URL_LIST" \
            '{host: $host, key: $key, keyLocation: $keyLoc, urlList: $urls}')
          HTTP_CODE=$(curl -s -o response.txt -w "%{http_code}" \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$PAYLOAD")
          echo "IndexNow respondio HTTP ${HTTP_CODE}"
          cat response.txt || true
          echo ""
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ]; then
            echo "IndexNow notifico ${COUNT} URLs a Bing"
          else
            echo "IndexNow fallo con HTTP ${HTTP_CODE}"
            exit 1
          fi
