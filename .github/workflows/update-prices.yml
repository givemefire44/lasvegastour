name: Update Tour Prices & Ratings (lasvegastour)

on:
  schedule:
    - cron: '0 6 * * 1,4'
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
      SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
      SANITY_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      VIATOR_API_KEY: ${{ secrets.VIATOR_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: tour-importer
        run: npm ci

      - name: Refrescar corpus desde Viator
        working-directory: tour-importer
        run: node ingest-corpus.mjs

      - name: Correr cron de precios y ratings
        working-directory: tour-importer
        run: node cron-prices.mjs --execute

      - name: Notify IndexNow (Bing)
        env:
          INDEXNOW_HOST: lasvegastour.com
          INDEXNOW_KEY: b62806b355294ae38198b7a021a1492a
        run: |
          set -e
          curl -fsSL -A "Mozilla/5.0" --retry 3 --retry-delay 5 "https://${INDEXNOW_HOST}/sitemap.xml" -o sitemap.xml || { echo "Sitemap no disponible, salteo"; exit 0; }
          grep -oP '(?<=<loc>)[^<]+' sitemap.xml | head -n 10000 > urls.txt
          COUNT=$(wc -l < urls.txt)
          echo "URLs: ${COUNT}"
          if [ "$COUNT" -eq 0 ]; then exit 0; fi
          URL_LIST=$(jq -R . urls.txt | jq -s .)
          PAYLOAD=$(jq -n --arg host "$INDEXNOW_HOST" --arg key "$INDEXNOW_KEY" --arg keyLoc "https://${INDEXNOW_HOST}/${INDEXNOW_KEY}.txt" --argjson urls "$URL_LIST" '{host: $host, key: $key, keyLocation: $keyLoc, urlList: $urls}')
          HTTP_CODE=$(curl -s -o response.txt -w "%{http_code}" -X POST "https://api.indexnow.org/indexnow" -H "Content-Type: application/json; charset=utf-8" -d "$PAYLOAD")
          echo "IndexNow HTTP ${HTTP_CODE}"